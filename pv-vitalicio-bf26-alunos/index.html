   CHECKOUT  link da oferta nova na Hotmart (pay.hotmart.com/…?off=…). Vazio = o botão não leva a lugar nenhum.
   PLAYER    id do player da VTurb (conta ECG). Vazio = sem vídeo e o botão aparece na hora.
   BOTAO_EM  segundo do vídeo em que o preço aparece; o botão surge nesse ponto. null = botão visível desde o início.
 O embed da VTurb vai entre os marcadores VTURB e /VTURB (o código de velocidade, se a VTurb der, no <head>).

<script>
(function () {
  // ---------- ligar aqui ----------
  var CHECKOUT = "https://pay.hotmart.com/Q105615633U?off=sqi8ftl2";   // oferta "Vitalicio BF26 alunos" (curso 7649305)
  var PLAYER = "6aee139995062e6d56ede57f";   // "[UPGRADE] ECG vitalício · alunos BF26", conta ECG (vid-<id> do embed)
  var BOTAO_EM = 172;     // "R$ 597 à vista" entra na tela aos 2:52 de vital-final.mp4 (whisper, 06/11); null = desde o início
  var ORIGEM = { src: "api", sck: "vitalicio-bf26_api", utm_source: "api", utm_campaign: "vitalicio-bf26" };
  // ---------------------------------

  var params = new URLSearchParams(location.search);
  var teste = params.get("teste") === "1";
  var bloco = document.getElementById("oferta");
  var bt = document.getElementById("bt");

  // Origem no checkout: o que vier na URL da página (src, sck, utm_*) vence o padrão do disparo.
  // Só passam essas chaves: nada de nome, e-mail ou telefone na URL.
  if (CHECKOUT) {
    var u = new URL(CHECKOUT);
    var chaves = ["src", "sck", "utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term"];
    chaves.forEach(function (k) {
      var v = params.get(k) || ORIGEM[k];
      if (v) u.searchParams.set(k, v.slice(0, 120));
    });
    bt.href = u.toString();
  } else {
    bt.addEventListener("click", function (e) { e.preventDefault(); });
  }

  var mostrado = false;
  var CHAVE_VISTO = "pv_vitalicio_bf26_preco_visto";
  function aoMostrar() {
    if (mostrado) return;
    mostrado = true;
    try { localStorage.setItem(CHAVE_VISTO, "1"); } catch (e) {}
    bloco.classList.remove("esconder");
  }

  if (teste || BOTAO_EM === null || !PLAYER) { aoMostrar(); return; }
  try { if (localStorage.getItem(CHAVE_VISTO) === "1") { aoMostrar(); return; } } catch (e) {}

  // O mesmo desenho do upsell do ECG GO (19-upsell-ecg-go, decisão 177): conta pelo tempo do vídeo; se o player ficou
  // pronto antes do listener, a checagem de 1 em 1 s lê o tempo direto; sem player em 20 s, o botão aparece.
  var player = document.getElementById("vid-" + PLAYER);
  if (!player) { aoMostrar(); return; }
  player.addEventListener("player:ready", function () {
    player.displayHiddenElements(BOTAO_EM, ["#oferta"], { persist: true, callback: aoMostrar });
  });
  var inicio = Date.now();
  var vigia = setInterval(function () {
    if (mostrado) { clearInterval(vigia); return; }
    var t = Number(player.currentTime);
    if (t >= BOTAO_EM) { aoMostrar(); return; }
    var carregou = (t > 0) || (Number(player.duration) > 0) ||
      (window.smartplayer && smartplayer.instances && smartplayer.instances.length > 0);
    if (!carregou && Date.now() - inicio > 20000) aoMostrar();
  }, 1000);
})();
</script>
