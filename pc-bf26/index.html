<title>Black do Plantonista · Dr. Vitor Coutinho</title>
<!--
 Link principal da captação da Black aberta (anúncio, bio, e-mail). Sorteia uma das versões da página e manda
 o visitante para /pc-bf26-vN/, levando query (UTMs) e hash. Quem volta cai sempre na mesma versão.
 Para ligar uma versão nova: crie a pasta pc-bf26-vN/ e dê peso a ela aqui. Peso 0 = fora do sorteio.
-->
<script>
(function () {
  var PESOS = { v1: 1, v2: 0, v3: 0 };
  var CHAVE = "pc-bf26-versao", v = null;
  try { v = localStorage.getItem(CHAVE); } catch (e) {}
  if (!v || !PESOS[v]) {
    var total = 0, k; for (k in PESOS) total += PESOS[k];
    var r = Math.random() * total;
    for (k in PESOS) { if (PESOS[k] && (r -= PESOS[k]) < 0) { v = k; break; } }
    v = v || "v1";
    try { localStorage.setItem(CHAVE, v); } catch (e) {}
  }
  location.replace("/pc-bf26-" + v + "/" + location.search + location.hash);
})();
</script>
