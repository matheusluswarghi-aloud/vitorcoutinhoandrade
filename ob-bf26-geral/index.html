<!--
 Página de obrigado da captação da Black geral (08/11, pedido do Matheus): o pop-up de /pc-bf26-v1/ manda para cá depois
 de gravar o lead, e o botão leva ao grupo VIP. O botão aponta para grupo.vitorcoutinhoandrade.com/aberta (rodízio do
 SendLus), nunca para um convite fixo, e leva a query que chegou aqui, para a origem e as UTMs seguirem até o clique.
 Sem JavaScript, ou aberta sem parâmetros, o botão continua levando ao grupo.
 O clique é um link comum, sem atraso: o navegador do Instagram e do Facebook só abre o WhatsApp a partir de um toque real.
 Pixel: só PageView e o evento próprio ClicouGrupoVIP. O Lead sai no envio do pop-up e não se repete aqui.
-->

<style>
:root{--fundo:#0F0E0D;--marfim:#F2ECE4;--cinza:#ADA59C;--vermelho:#D63A2E;--vermelho-h:#BC2F24}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--fundo)}
body{background:var(--fundo);color:var(--marfim);font-family:"Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
main{width:100%;max-width:560px;margin:0 auto;padding:56px 24px 40px;text-align:center}
h1{font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
p{margin-top:18px;font-size:19px;line-height:1.5;font-weight:500;color:var(--cinza);text-wrap:balance}
p b{color:var(--marfim);font-weight:800}
.bt{display:block;width:100%;max-width:440px;margin:30px auto 0;background:var(--vermelho);color:#fff;text-decoration:none;text-align:center;font-weight:800;font-size:20px;letter-spacing:-.01em;padding:22px 18px;border-radius:4px;transition:background .15s}
.bt:hover{background:var(--vermelho-h)}
.bt:focus-visible{outline:2px solid var(--marfim);outline-offset:3px}
@media (min-width:600px){main{padding-top:14vh}h1{font-size:52px}p{font-size:21px}}

<script>
var OB_TESTE = new URLSearchParams(location.search).get("teste") === "1";
if (location.hostname === "vitorcoutinhoandrade.com" && !OB_TESTE) {

<body>
<main>
  <h1>Inscrição quase concluída</h1>
  <p>Agora só falta entrar no <b>grupo VIP da Black do Plantonista</b>. Clique no botão abaixo.</p>
  <a class="bt" id="bt" href="https://grupo.vitorcoutinhoandrade.com/aberta">Entrar no grupo VIP</a>
</main>
<script>
(function () {
  var bt = document.getElementById("bt");
  var q = new URLSearchParams(location.search);
  q.delete("teste");
  if (!q.get("origem")) q.set("origem", "ob-bf26-geral-direto");
  bt.href = "https://grupo.vitorcoutinhoandrade.com/aberta?" + q.toString();
  bt.addEventListener("click", function () {
    if (typeof fbq === "function") fbq("trackCustom", "ClicouGrupoVIP");
  });
})();
