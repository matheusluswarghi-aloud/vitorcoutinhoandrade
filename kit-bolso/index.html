<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kit de Bolso do Plantonista</title>
<!--
 Entrega do Kit de Bolso para o grupo dos alunos (04/11/2026). Fica trancado até a senha, que o Vitor fala no fim da
 live das 20h. A senha não está nesta página: os PDFs moram numa pasta cujo nome é o SHA-256 de "kit-bolso:<SENHA>"
 (24 primeiros caracteres). Senha certa = a pasta existe. Para trocar a senha, gere o hash novo e renomeie a pasta.
 Visual: o da página de vendas da Black (pc-bf26-v1): grafite, marfim, um vermelho, só Schibsted Grotesk. As folhas
 são o topo real de cada PDF, renderizado do próprio arquivo.
-->
<meta property="og:type" content="website">
<meta property="og:url" content="https://vitorcoutinhoandrade.com/kit-bolso/">
<meta property="og:title" content="Kit de Bolso do Plantonista">
<meta property="og:description" content="5 guias para abrir no celular, no meio do plantão. A senha sai hoje, às 20h, ao vivo.">
<meta property="og:image" content="https://vitorcoutinhoandrade.com/kit-bolso/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#0F0E0D; --fundo3:#1D1A17; --fio:#2E2A26;
  --marfim:#F2ECE4; --cinza:#ADA59C; --cinza2:#7F776F;
  --vermelho:#D63A2E; --vermelho-h:#BC2F24; --brasa:rgba(214,58,46,.26);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--fundo);overflow-x:hidden}
html,body{max-width:100%;overflow-x:clip}
body{background:var(--fundo);color:var(--marfim);font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
:focus-visible{outline:2px solid var(--marfim);outline-offset:3px}
h1{text-wrap:balance}

main{max-width:520px;margin:0 auto;padding:0 24px 72px;text-align:center;
  background:radial-gradient(ellipse 90% 340px at 50% 150px,var(--brasa),transparent 72%)}

/* as cinco folhas abertas em leque, a do meio na frente */
.leque{position:relative;height:330px;margin:0 -24px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 98%);mask-image:linear-gradient(180deg,#000 62%,transparent 98%)}
.leque img{position:absolute;left:50%;top:44px;width:178px;margin-left:-89px;border-radius:6px;
  box-shadow:0 26px 50px -12px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.04)}
.leque .f1{transform:translate(-128%,40px) rotate(-15deg);z-index:1}
.leque .f2{transform:translate(-66%,12px) rotate(-7deg);z-index:2}
.leque .f3{transform:translate(0,0);z-index:3}
.leque .f4{transform:translate(66%,12px) rotate(7deg);z-index:2}
.leque .f5{transform:translate(128%,40px) rotate(15deg);z-index:1}

h1{font-weight:900;font-size:clamp(40px,11vw,58px);line-height:.98;letter-spacing:-.045em;margin-top:-26px;position:relative}
.apoio{font-size:18px;color:var(--cinza);margin-top:14px}

form{display:flex;gap:8px;margin-top:34px}
input{flex:1;min-width:0;height:62px;padding:0 16px;background:var(--fundo3);border:1px solid var(--fio);border-radius:4px;
  color:var(--marfim);font:800 20px/1 "Schibsted Grotesk",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;text-align:center}
input::placeholder{color:var(--cinza2);letter-spacing:.02em;text-transform:none;font-weight:600}
input:focus{outline:none;border-color:var(--cinza)}
.liberar{flex:none;height:62px;padding:0 22px;border:0;border-radius:4px;background:var(--marfim);color:var(--fundo);
  font:800 18px/1 "Schibsted Grotesk",system-ui,sans-serif;cursor:pointer}
.erro{min-height:24px;margin-top:10px;font-size:15px;color:#F0897F}

.quando{margin-top:22px;padding-top:26px;border-top:1px solid var(--fio);font-size:18px;color:var(--cinza)}
.quando b{color:var(--marfim);font-weight:800}
.bt{display:block;margin-top:18px;background:var(--vermelho);color:#fff;text-decoration:none;font-weight:800;font-size:20px;
  letter-spacing:-.01em;padding:22px 18px;border-radius:4px;box-shadow:0 18px 40px -16px rgba(214,58,46,.7);transition:background .15s}
.bt:hover{background:var(--vermelho-h)}

/* liberado: a lista dos cinco no lugar da senha */
.guias{display:none;list-style:none;margin-top:34px;text-align:left;border-top:1px solid var(--fio)}
.guias a{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--fio);color:inherit;text-decoration:none}
.guias .mini{flex:none;width:58px;height:74px;border-radius:4px;overflow:hidden;background:#000}
.guias .mini img{width:100%;height:100%;object-fit:cover;object-position:top}
.guias b{display:block;font-weight:800;font-size:19px;line-height:1.2;letter-spacing:-.015em}
.guias span{display:block;font-size:15px;color:var(--cinza);margin-top:3px}
.guias i{margin-left:auto;font-style:normal;font-weight:800;font-size:22px;color:var(--vermelho)}
.liberado .tranca{display:none}
.liberado .guias{display:block}
.liberado .apoio{color:var(--marfim)}
</style>
</head>
<body>
<main id="pagina">
  <div class="leque" aria-hidden="true">
    <img class="f1" src="img/folha-01-checklist-plantao-seguro.webp" alt="" width="520" height="988" draggable="false">
    <img class="f2" src="img/folha-02-sequencia-do-ecg.webp" alt="" width="520" height="988" draggable="false">
    <img class="f4" src="img/folha-04-drogas-vasoativas.webp" alt="" width="520" height="988" draggable="false">
    <img class="f5" src="img/folha-05-doses-na-emergencia.webp" alt="" width="520" height="988" draggable="false">
    <img class="f3" src="img/folha-03-doses-de-iot.webp" alt="" width="520" height="988" draggable="false">
  </div>

  <h1>Kit de Bolso do Plantonista</h1>
  <p class="apoio" id="apoio">5 guias para abrir no celular, no meio do plantão.</p>

  <div class="tranca">
    <form id="form" autocomplete="off">
      <input id="senha" type="text" aria-label="Senha do Kit" placeholder="Digite a senha" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="liberar" type="submit">Liberar</button>
    </form>
    <p class="erro" id="erro" role="alert"></p>
    <p class="quando" id="quando">A senha sai <b>hoje, às 20h</b>, ao vivo.</p>
    <a class="bt" id="live" href="https://www.youtube.com/live/fIyecsl0HRc" target="_blank" rel="noopener">Ativar lembrete da live</a>
  </div>

  <ol class="guias" id="guias"></ol>
</main>

<script>
const GUIAS = [
  ["01-checklist-plantao-seguro", "Checklist do Plantão Seguro"],
  ["02-sequencia-do-ecg", "Sequência do ECG"],
  ["03-doses-de-iot", "Doses de IOT"],
  ["04-drogas-vasoativas", "Drogas Vasoativas"],
  ["05-doses-na-emergencia", "Doses na Emergência"],
];
const pagina = document.getElementById("pagina");
document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG" || e.target.closest(".leque,.mini")) e.preventDefault(); });
document.addEventListener("dragstart", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

// Botão da live conforme a hora de Brasília: lembrete antes, "no ar" durante, aula depois.
(function () {
  const agora = Date.now(), inicio = Date.parse("2026-11-04T19:50:00-03:00"), fim = Date.parse("2026-11-05T00:30:00-03:00");
  const live = document.getElementById("live"), quando = document.getElementById("quando");
  if (agora >= inicio && agora < fim) {
    live.textContent = "Entrar na live agora";
    quando.innerHTML = "A live está <b>no ar</b>. A senha sai lá.";
  } else if (agora >= fim) {
    live.textContent = "Ver a aula";
    quando.innerHTML = "A senha saiu na aula de <b>04/11</b>.";
  }
})();

async function pasta(senha) {
  const limpa = senha.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("kit-bolso:" + limpa));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 24);
}
function liberar(p) {
  const lista = document.getElementById("guias");
  lista.textContent = "";
  for (const [arq, nome] of GUIAS) {
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = `${p}/${arq}.pdf`; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<div class="mini"><img src="img/folha-${arq}.webp" alt="" draggable="false"></div><div><b></b><span>Abrir o PDF</span></div><i>→</i>`;
    a.querySelector("b").textContent = nome;
    li.appendChild(a); lista.appendChild(li);
  }
  document.getElementById("apoio").textContent = "Liberado. Toque para abrir e salve no celular.";
  pagina.classList.add("liberado");
  try { localStorage.setItem("kit-bolso", p); } catch (e) {}
}
async function confere(p) {
  try { const r = await fetch(`${p}/01-checklist-plantao-seguro.pdf`, { method: "HEAD", cache: "no-store" }); return r.ok; }
  catch (e) { return false; }
}
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const erro = document.getElementById("erro"), v = document.getElementById("senha").value;
  erro.textContent = "";
  if (!v.trim()) { erro.textContent = "Digite a senha."; return; }
  const p = await pasta(v);
  if (await confere(p)) liberar(p);
  else erro.textContent = "Senha errada.";
});
(async () => {
  let p = null; try { p = localStorage.getItem("kit-bolso"); } catch (e) {}
  if (p && await confere(p)) liberar(p);
})();
</script>
</body>
</html>
